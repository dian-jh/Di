name: TypeScript core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [22.19.0, 24]

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # the C# compatibility harness archives its pinned baseline commit

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Install locked dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          npm test 2>&1 | tee test-results/unit.log

      - name: Run C# compatibility tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          npm run test:compat 2>&1 | tee test-results/compat.log

      - name: Save test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs-${{ matrix.os }}-node-${{ matrix.node }}
          path: test-results/*.log
          if-no-files-found: ignore
